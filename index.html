<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astral</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c1230">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Astral"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1230;--bg2:#1b1f55;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--fg:#f3f5ff;--mut:#a3abd0;--ac:#ff6a3d;--gold:#ffc94d;--ok:#4be3a5;--cy:#5ee0ff;
--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--sans:Inter,"Segoe UI",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,#3a2a8f55,transparent 60%),radial-gradient(700px 500px at -10% 30%,#ff6a3d22,transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--fg);font:16px/1.5 var(--sans)}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 56px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{font:italic 800 24px var(--disp);letter-spacing:.01em;display:flex;align-items:center;gap:9px}
.brand i{width:12px;height:12px;background:var(--ac);border-radius:3px;transform:rotate(45deg);display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.hero{min-height:132px;margin-bottom:12px}
#fig{font:italic 800 clamp(44px,13vw,74px)/.95 var(--disp);margin:0;letter-spacing:-.01em;transition:color .25s}
#fig.wait{color:rgba(243,245,255,.38)}
#fig:not(.wait){color:var(--gold);text-shadow:0 0 38px #ffc94d44}
#st{margin:10px 0 0;color:var(--mut);font-size:14px;min-height:22px;max-width:46ch}
.stage{position:relative;background:#05081c;border-radius:20px;overflow:hidden;min-height:190px;border:1.5px solid var(--line);box-shadow:0 18px 50px #00000066;transition:border-color .3s,box-shadow .3s}
.stage.on{border-color:var(--gold);box-shadow:0 0 0 4px #ffc94d22,0 18px 60px #ffc94d2a}
.stage .bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:#ffffff1a}
canvas{width:100%;display:block}
video{display:none}
#bf{height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--gold));transition:width .15s}
.row{display:flex;gap:10px;margin:12px 0}
button,label.b{flex:1;text-align:center;padding:13px 12px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:600 15px var(--sans);cursor:pointer;transition:transform .12s,filter .12s;box-shadow:0 8px 22px #ff6a3d44}
button:hover,label.b:hover{filter:brightness(1.08)}button:active,label.b:active{transform:scale(.97)}
label.b,.alt{background:var(--card);color:var(--fg);border:1px solid var(--line);box-shadow:none}
button:focus-visible,label.b:focus-within{outline:3px solid var(--cy);outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.live{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0}
.live div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;backdrop-filter:blur(6px)}
.live b{display:block;font:italic 800 52px/1 var(--disp);font-variant-numeric:tabular-nums}
.live span{color:var(--mut);font-size:13px}
#list{margin-top:10px}
.res{background:linear-gradient(135deg,#ffc94d26,#ff6a3d1c);border:1px solid #ffc94d66;border-radius:20px;padding:20px;margin-top:16px}
.res h2{margin:0;font:italic 800 28px var(--disp);color:var(--gold)}
.res .big{font:italic 800 84px/1 var(--disp);margin:4px 0;font-variant-numeric:tabular-nums}
.res .big small{font:500 16px var(--sans);color:var(--mut);margin-left:6px}
.res p{margin:5px 0;color:#d9defa;font-size:15px}
h3{font:italic 800 22px var(--disp);margin:30px 0 6px}
.h{display:flex;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-top:8px;font-weight:600}
.h small{color:var(--mut);display:block;font-weight:400;font-size:13px}
.h span:last-child{text-align:right;color:var(--gold)}
[hidden]{display:none!important}
.pick{display:block;color:var(--mut);font-size:13px;margin:4px 2px 6px}
select{width:100%;padding:14px;margin-bottom:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 16px var(--sans)}
select option{color:#13171c}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:8px}
.c b{display:flex;justify-content:space-between;font-size:15px}
.c .t{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.c.ok b{color:var(--ok)}.c.ko b{color:#ff8fa8}
/* ---- mascotte + questionnaire + programme ---- */
.ob{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));background:radial-gradient(800px 500px at 80% -10%,#3a2a8f88,transparent 60%),radial-gradient(600px 500px at 0% 90%,#ff6a3d33,transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));overflow-y:auto}
.ob-in{width:100%;max-width:460px;margin:auto}
.tiger{width:132px;height:132px;display:block;margin:0 auto -6px;filter:drop-shadow(0 12px 22px #00000066)}
.tiger.hop{animation:hop .5s ease-out}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-14px) rotate(-3deg)}70%{transform:translateY(0) rotate(2deg)}100%{transform:none}}
.bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;font-size:17px;font-weight:500;line-height:1.4;backdrop-filter:blur(6px)}
.bubble:before{content:"";position:absolute;top:-8px;left:50%;width:14px;height:14px;background:#2a2f6b;border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bubble small{display:block;color:var(--mut);font-weight:400;font-size:13px;margin-top:4px}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.dots i{width:22px;height:5px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--ac)}
.opts{display:grid;gap:9px;margin-top:14px}
.opt{flex:none;text-align:left;padding:14px 16px;background:var(--card);border:1px solid var(--line);color:var(--fg);box-shadow:none;border-radius:14px}
.opt small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.opt.sel{border-color:var(--gold);background:#ffc94d22}
.ob input[type=text]{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 17px var(--sans);margin-top:14px}
.ob .go{width:100%;margin-top:14px}
.ob .go[disabled]{opacity:.4;cursor:default;box-shadow:none}
.ob .skip{display:block;margin:12px auto 0;background:none;border:0;color:var(--mut);font:500 13px var(--sans);box-shadow:none;flex:none;padding:6px;text-decoration:underline}
.mini{width:44px;height:44px;flex:none;padding:0;background:none;border:0;box-shadow:none;cursor:pointer;border-radius:50%}
.mini svg{width:100%;height:100%}
.prog{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:16px}
.prog h2{margin:0;font:italic 800 26px var(--disp);color:var(--gold)}
.prog .sub{color:var(--mut);font-size:14px;margin:2px 0 10px}
.prog .goal{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#ffc94d1c;border:1px solid #ffc94d55;border-radius:14px;padding:10px 14px;margin:10px 0}
.prog .goal b{font:italic 800 22px var(--disp);color:var(--gold)}
.prog .goal button{flex:none;padding:9px 14px;font-size:13px}
.prog details{border-top:1px solid var(--line);padding:10px 0}
.prog summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.prog summary::-webkit-details-marker{display:none}
.prog summary span{color:var(--mut);font-weight:400;font-size:13px}
.prog ul{margin:8px 0 0;padding-left:18px;color:#d9defa;font-size:14px}
.prog li{margin:3px 0}
.prog .note{color:var(--mut);font-size:13px;margin:10px 0 0}
.prog .redo{margin-top:12px;width:100%}
.dm{margin:-4px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.dm summary{cursor:pointer;font-weight:600;font-size:14px}
.anim{background:#05081c;border-radius:14px;border:1px solid var(--line);margin-top:8px}
.anim svg{width:100%;max-width:300px;display:block;margin:0 auto}
.demo p,.dm p{margin:6px 0 2px;color:var(--mut);font-size:13px}
.ex{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.acts{display:flex;gap:6px;flex:none}
button.sm{flex:none;padding:5px 11px;font-size:12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--fg);box-shadow:none}
button.sm.an{background:var(--ac);border-color:transparent}
/* ---- navigation + page séances ---- */
.wrap{padding-bottom:104px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:#0c1230ee;backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tabs div{display:flex;gap:8px;width:100%;max-width:640px}
.tab{background:none;border:1px solid transparent;box-shadow:none;color:var(--mut);padding:11px 8px;border-radius:14px}
.tab.on{color:var(--fg);background:var(--card);border-color:var(--line)}
.pghead h2{margin:0;font:italic 800 38px/1 var(--disp)}
.pg .sub{color:var(--mut);font-size:14px;margin:6px 0 12px}
.pg .goal{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#ffc94d1c;border:1px solid #ffc94d55;border-radius:14px;padding:10px 14px;margin:10px 0}
.pg .goal b{font:italic 800 22px var(--disp);color:var(--gold)}
.pg .goal button{flex:none;padding:9px 14px;font-size:13px}
.wkc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:10px 0}
.wkc b{font:italic 800 26px var(--disp);color:var(--gold)}
.wk{display:flex;gap:6px;margin-top:8px}.wk i{flex:1;height:8px;border-radius:9px;background:var(--line)}.wk i.on{background:var(--ok)}
.sc{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;flex:none;text-align:left;margin-top:10px;padding:14px 16px;background:var(--card);border:1px solid var(--line);color:var(--fg);box-shadow:none;border-radius:16px}
.sc b{display:block;font:italic 800 22px var(--disp)}
.sc small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.sc .stt{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--mut);white-space:nowrap}
.sc.next{border-color:var(--gold);background:#ffc94d14}.sc.next .stt{color:var(--gold);border-color:#ffc94d77}
.sc.done .stt{color:var(--ok);border-color:#4be3a577}
.pg .note{color:var(--mut);font-size:13px;margin:10px 0 0}
.pg .redo{margin-top:18px;width:100%}
.back{flex:none;background:none;border:0;box-shadow:none;color:var(--mut);font:500 14px var(--sans);padding:4px 0;margin-bottom:10px;text-align:left}
.pbar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--gold));transition:width .25s}
.dx{list-style:none;margin:12px 0 0;padding:0}
.dx li{padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.dx li.dn .tx{opacity:.45;text-decoration:line-through}
.dx li.tip{color:var(--mut);font-size:13px;border-top:0;padding:0 0 10px 34px;margin-top:-6px}
.ex{align-items:center;flex-wrap:wrap}
.ex .tx{flex:1;min-width:0}
.ck{flex:none;width:26px;height:26px;padding:0;border-radius:50%;background:none;border:2px solid var(--line);box-shadow:none;color:#06281c;font-weight:800;font-size:14px;line-height:1}
.ck.on{background:var(--ok);border-color:var(--ok)}.ck.on:after{content:"✓"}
button.rb{flex:none;padding:6px 11px;font-size:12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--fg);box-shadow:none}
.rest{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;background:#1b1f55f2;border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(8px)}
.rest b{font:italic 800 30px var(--disp);min-width:64px}.rest b.run{color:var(--gold)}
.rest span{display:flex;gap:6px;flex-wrap:wrap}
.fin{width:100%;margin-top:14px}
.nums{display:grid;gap:10px;margin-top:14px}
.nm{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.nm span{font-weight:600}
.stp{display:flex;align-items:center;gap:8px}
.pm{flex:none;width:40px;height:40px;padding:0;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--fg);box-shadow:none;font-size:20px;line-height:1}
.stp input{width:58px;text-align:center;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:#00000040;color:var(--fg);font:700 18px var(--sans);-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.sg div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
.sg b{display:block;font:italic 800 34px/1 var(--disp);color:var(--gold);font-variant-numeric:tabular-nums}
.sg b small{font:500 13px var(--sans);color:var(--mut);margin-left:3px}
.sg span{color:var(--mut);font-size:12px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px}
.rc.no{opacity:.55}
.rc h4{margin:0 0 8px;font:italic 800 24px var(--disp);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rc h4 small{font:400 12px var(--sans);color:var(--mut)}
.rc .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rc .g b{display:block;font:italic 800 38px/1 var(--disp);color:var(--gold);font-variant-numeric:tabular-nums}
.rc .g b i{font:500 13px var(--sans);color:var(--mut);font-style:normal;margin-left:3px}
.rc .g span{color:var(--mut);font-size:12px}
.rc .m{margin:10px 0 0;color:var(--mut);font-size:13px}

/* ---- progression + déverrouillage ---- */
.tab{font-size:13.5px;padding:11px 4px}
.pr h2{font:italic 800 30px var(--disp);margin:0}
.pr .sub{color:var(--mut);font-size:14px;margin:4px 0 14px;line-height:1.4}
.fam{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 6px;margin:12px 0}
.fam h3{margin:0 0 6px;font:italic 800 24px var(--disp);display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.fam h3 small{font:500 12px var(--sans);color:var(--mut)}
.st{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.st>div{flex:1;min-width:0}
.st .ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:16px;border:1.5px solid var(--line);background:#ffffff0d;color:var(--mut)}
.st.done .ic{background:#4be3a52b;border-color:#4be3a5aa;color:var(--ok);font-weight:700}
.st.cur .ic{background:#ffc94d22;border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px #ffc94d1f}
.st.lock{opacity:.55}
.st b{display:block;font:italic 800 21px var(--disp)}
.st small{display:block;color:var(--mut);font-size:13px;line-height:1.35}
.mt{display:grid;grid-template-columns:84px 1fr 54px;gap:8px;align-items:center;font-size:12px;color:var(--mut);margin-top:8px}
.mt em{font-style:normal;text-align:right;color:var(--fg)}
.meter{height:6px;border-radius:9px;background:#ffffff1a;overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--gold))}
.st .gofig2{flex:none;width:auto;margin-top:10px;padding:9px 16px;font-size:13px}
.unl{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:radial-gradient(600px 420px at 50% 38%,#3a2a8fcc,#05081cf5);backdrop-filter:blur(6px);animation:unlf .3s both}
.unl-in{position:relative;text-align:center;max-width:380px;width:100%}
.lockw{position:relative;width:150px;height:175px;margin:0 auto 6px;animation:lkglow 1s 1s both}
.lockw svg{position:relative;width:100%;height:100%;overflow:visible}
.lk{animation:lkshake .55s .25s both}
.shk{transform-origin:84px 62px;stroke:#cfd5ff;animation:lkopen .9s .95s cubic-bezier(.3,1.35,.5,1) both}
.lkb{fill:#7d86c4;animation:lkfill .4s 1s both}
.rays{position:absolute;left:50%;top:56%;width:0;height:0}
.ray{position:absolute;left:-2px;top:-23px;width:4px;height:46px;border-radius:4px;background:linear-gradient(var(--gold),transparent);opacity:0;animation:unlray .9s 1.05s ease-out both}
.unl .k{letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--ok);margin:0;animation:unlup .5s 1.25s both}
.unl h2{font:italic 800 clamp(34px,10vw,50px)/1 var(--disp);color:var(--gold);margin:8px 0 8px;text-shadow:0 0 34px #ffc94d66;animation:unlup .6s 1.4s both}
.unl p.d{color:var(--mut);font-size:15px;line-height:1.45;margin:0 0 18px;animation:unlup .6s 1.6s both}
.unl .row{animation:unlup .6s 1.8s both}
@keyframes unlf{from{opacity:0}to{opacity:1}}
@keyframes unlup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lkshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes lkopen{0%{transform:none}45%{transform:translateY(-18px)}100%{transform:translateY(-18px) rotate(-40deg);stroke:#ffc94d}}
@keyframes lkfill{from{fill:#7d86c4}to{fill:#ffc94d}}
@keyframes lkglow{from{filter:drop-shadow(0 0 0 #ffc94d00)}to{filter:drop-shadow(0 0 24px #ffc94dcc)}}
@keyframes unlray{0%{opacity:0;transform:rotate(var(--a)) translateY(-20px) scaleY(.3)}30%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateY(-120px) scaleY(1)}}
@media (prefers-reduced-motion:reduce){.unl,.unl *{animation:none!important}.shk{transform:translateY(-18px) rotate(-40deg);stroke:#ffc94d}.lkb{fill:#ffc94d}.ray{display:none}}

/* ---- barre du bas en icônes + séances perso ---- */
.tab{display:flex;align-items:center;justify-content:center;padding:12px 4px}
.tab svg{width:27px;height:27px;display:block;pointer-events:none}
.tab.on{color:var(--gold)}
.ced input[type=text],.ced input[type=number],.ti{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 16px var(--sans);box-sizing:border-box}
.ti{margin:6px 0 4px;font-size:18px}
.ced{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:14px}
.ced>b{font:italic 800 20px var(--disp)}
.chp{display:flex;gap:6px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.chp::-webkit-scrollbar{display:none}
.chp button{flex:none;padding:6px 12px;font-size:13px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--fg);box-shadow:none}
.nr{display:flex;align-items:center;gap:8px;margin:8px 0 12px}

<script>
const $=s=>document.querySelector(s);
const v=$('#v'),c=$('#c'),x=c.getContext('2d');
const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n));
const band=(val,lo,hi,m)=>clamp(1-(val<lo?lo-val:val>hi?val-hi:0)/m);
const hz=(p,q)=>Math.atan2(Math.abs(q.y-p.y),Math.abs(q.x-p.x))*180/Math.PI;
function ang(a,b,d){const p=[a.x-b.x,a.y-b.y],q=[d.x-b.x,d.y-b.y];const m=Math.hypot(...p)*Math.hypot(...q)||1;return Math.acos(clamp((p[0]*q[0]+p[1]*q[1])/m,-1,1))*180/Math.PI}
const BONES=[[11,13],[13,15],[12,14],[14,16],[11,12],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];

/* métriques : [nom, unité, échelle, conseil si trop bas, conseil si trop haut] */
const MI={E:['Bras','°',1,'Tends davantage les bras.','Plie davantage les coudes.'],H:['Hanches','°',1,'Ouvre davantage les hanches.','Ferme davantage les hanches.'],K:['Genoux','°',1,'Tends davantage les jambes.','Replie davantage les genoux.'],B:['Alignement épaules-pieds','°',1,'Redresse le corps.','Aplatis le corps (plus horizontal).'],T:['Buste','°',1,'Redresse le buste.','Aplatis le buste.'],L:['Épaules devant les mains','%',100,'Avance les épaules devant les mains.','Recule les épaules à la verticale des mains.'],Hh:['Hauteur des hanches','%',100,'Monte les hanches.','Baisse un peu les hanches.'],F:['Pieds décollés','%',100,'Décolle et monte les pieds.','Baisse un peu les pieds.'],G:['Jambes par rapport aux hanches','%',100,'Monte les jambes plus haut.','Baisse un peu les jambes.'],N:['Menton au-dessus de la barre','%',100,'Monte le menton au-dessus de la barre.','Position haute atteinte.']};
/* [id, nom, [[métrique, min, max, marge, points]]] */
const FIGS=[
['tp','Tuck planche',[['E',158,180,30,25],['L',.22,.65,.3,25],['Hh',-.05,.4,.35,20],['H',18,55,15,15],['F',.2,.9,.25,15]]],
['atp','Advanced tuck planche',[['E',165,180,25,20],['L',.25,.8,.3,20],['T',0,18,18,20],['H',70,110,15,20],['K',60,110,20,10],['F',.15,1.2,.3,10]]],
['pl','Planche',[['E',168,180,20,20],['B',0,10,14,25],['H',160,180,25,15],['K',165,180,20,15],['L',.3,.9,.3,15],['Hh',-.3,.3,.3,10]]],
['pll','Planche lean',[['E',168,180,20,20],['L',.4,1,.3,35],['B',0,22,20,15],['H',160,180,25,15],['K',160,180,25,15]]],
['fl','Front lever',[['E',168,180,20,20],['B',0,12,15,30],['H',160,180,25,20],['K',165,180,20,15],['Hh',-.2,.2,.25,15]]],
['tfl','Tuck front lever',[['E',168,180,20,20],['T',0,15,15,30],['H',25,70,30,15],['K',20,75,30,15],['Hh',-.2,.25,.3,20]]],
['afl','Advanced tuck front lever',[['E',168,180,20,20],['T',0,15,15,25],['H',75,120,30,20],['K',70,115,30,15],['Hh',-.2,.25,.3,20]]],
['ls','L-sit',[['E',165,180,20,20],['T',72,90,18,15],['K',165,180,20,20],['H',75,100,25,25],['G',-.2,.3,.3,20]]],
['vs','V-sit',[['E',165,180,20,15],['T',55,88,20,15],['K',165,180,20,20],['H',35,70,25,25],['G',.55,1.3,.4,25]]],
['tls','Tuck L-sit',[['E',165,180,20,25],['T',68,90,20,20],['K',35,100,30,25],['H',35,95,30,30]]],
['hl','L-sit suspendu',[['E',165,180,20,15],['K',165,180,20,25],['H',70,105,25,25],['G',-.2,.3,.3,20],['T',65,90,20,15]]]
];
/* conditions obligatoires : évitent de confondre la station debout avec une figure */
const GATE={vs:M=>M.G>-.6,hl:M=>M.G>-.6,pl:M=>M.B<50,pll:M=>M.B<50,fl:M=>M.B<50,tp:M=>M.H<72,atp:M=>M.H>58,tfl:M=>M.H<75,afl:M=>M.H>65,ls:M=>M.G>-.6&&M.K>135,tls:M=>M.G>-.6&&M.K<140};
const NAME=Object.fromEntries(FIGS.map(f=>[f[0],f[1]]));

const LOCK=60,KEEP=45,CONFIRM=.6,GRACE=.8,MIN_HOLD=1;
/* déblocage de l'étape suivante : tenir UNL_SEC secondes avec une note d'au moins UNL_SCORE/100 */
const UNL_SEC=20,UNL_SCORE=90;
let pose=null,running=false,busy=false,stream=null,flip=true;
let ema={},cand=null,act=null,lastT=0;
const now=()=>stream?performance.now()/1000:v.currentTime;
const status=t=>{$('#st').textContent=t;const g=$('#gst');if(g)g.textContent=t};

function metrics(lm,W,H){
  const L=[11,13,15,23,25,27],R=[12,14,16,24,26,28];
  const vis=a=>a.reduce((s,i)=>s+(lm[i].visibility||0),0)/a.length;
  const side=vis(L)>=vis(R)?L:R;if(vis(side)<.5)return null;
  const P=i=>({x:lm[i].x*W,y:lm[i].y*H});
  const [s,e,w,h,k,a]=side.map(P),nose=P(0);
  const dir=Math.sign(nose.x-h.x)||1,t=Math.hypot(s.x-h.x,s.y-h.y)||1;
  return{A:ang(s,h,a),E:ang(s,e,w),H:ang(s,h,k),K:ang(h,k,a),B:hz(s,a),T:hz(s,h),L:(s.x-w.x)*dir/t,Hh:(s.y-h.y)/t,F:(w.y-a.y)/t,G:(h.y-a.y)/t,N:(w.y-nose.y)/t,W:(s.y-w.y)/t};
}
function scoreFig(f,M){
  const parts=f[2].map(([m,lo,hi,mg,wt])=>({m,wt,lo,hi,val:M[m],f:band(M[m],lo,hi,mg)}));
  const raw=parts.reduce((s,p)=>s+p.wt*p.f,0);
  const g=GATE[f[0]];
  return{score:g&&!g(M)?0:100*Math.pow(raw/100,.7),parts};
}

/* ---- suivi : détection automatique puis fin de maintien ---- */
function track(t,R){
  const id=$('#sel').value,r=R[id];
  ema[id]=ema[id]==null?r.score:ema[id]*.65+r.score*.35;
  const s=ema[id];
    if(!act){
    if(s<LOCK){cand=null;setHero(null,NAME[id]);status('Prends la position : '+NAME[id]+'.');return}
    if(!cand)cand={t0:t,samples:[]};
    cand.samples.push({t,s,p:r.parts});
    if(t-cand.t0<CONFIRM){status('Position repérée…');return}
    act={id,t0:cand.t0,last:t,samples:cand.samples};cand=null;$('#res').hidden=true;$('#list').innerHTML='';$('#n').textContent='…';
  }else act.samples.push({t,s,p:r.parts});
  if(s>=KEEP)act.last=t;else if(t-act.last>GRACE){finish();return}
  setHero(NAME[id]);status('Tiens la position. Le résultat s\'affichera à la fin de la figure.');
  $('#tm').textContent=(t-act.t0).toFixed(1);
}
function renderList(parts){
  $('#list').innerHTML=parts.map(p=>{const mi=MI[p.m],good=p.f>=.6,fm=n=>Math.round(n*mi[2])+mi[1];
    return `<div class="c ${good?'ok':'ko'}"><b><span>${good?'✓':'✗'} ${mi[0]}</span><span>${Math.round(p.wt*p.f)}/${p.wt}</span></b><span class="t">${fm(p.val)} · cible ${fm(p.lo)} à ${fm(p.hi)}${good?'':' — '+(p.val<p.lo?mi[3]:mi[4])}</span></div>`}).join('');
}
function setHero(name,tmp){const h=$('#fig');$('.stage').classList.toggle('on',!!name);h.textContent=name||tmp||'En attente d\'une figure';h.className=name?'':'wait'}
function miss(t){if(rp&&t-rp.last>2.5)finishReps();cand=null;if(act&&t-act.last>GRACE)finish()}

function finish(){
  const a=act;act=null;cand=null;ema={};lastT=0;
  $('#bf').style.width='0';$('#tm').textContent='0.0';setHero(null,NAME[$('#sel').value]);
  if(!a){$('#n').textContent='–';return}
  const S=a.samples.filter(q=>q.t<=a.last),dur=a.last-a.t0;
  if(!S.length||dur<MIN_HOLD){$('#n').textContent='–';status('Position trop courte pour être notée (moins d\'une seconde).');return}
  const avg=Math.round(S.reduce((s,q)=>s+q.s,0)/S.length),peak=Math.round(Math.max(...S.map(q=>q.s)));
  /* point faible : critère qui fait perdre le plus de points en moyenne */
  const nP=S[0].p.length;let worst=null,loss=0;
  for(let i=0;i<nP;i++){
    const l=S.reduce((s,q)=>s+q.p[i].wt*(1-q.p[i].f),0)/S.length;
    if(l>loss){loss=l;const val=S.reduce((s,q)=>s+q.p[i].val,0)/S.length,p=S[0].p[i],mi=MI[p.m];
      worst={n:mi[0],tip:val<p.lo?mi[3]:mi[4],l}}
  }
  $('#n').textContent=avg;$('#bf').style.width=avg+'%';
  renderList(S[0].p.map((p0,i)=>({...p0,val:S.reduce((t,q)=>t+q.p[i].val,0)/S.length,f:S.reduce((t,q)=>t+q.p[i].f,0)/S.length})));
  const up=addRec(a.id,avg,peak,+dur.toFixed(1),Date.now());try{localStorage.setItem('fd_rec',JSON.stringify(REC))}catch(e){}
  const win=bestWin(S,UNL_SEC),un=progCheck(a.id,win),pl=progLine(a.id,win,dur,un);
  const badge=up.note&&up.hold?'Nouveau record : note et durée !':up.note?'Nouveau record de note !':up.hold?'Nouveau record de durée !':'';

function onRes(r){
  const W=v.videoWidth,H=v.videoHeight;if(!W)return;

  c.width=W;c.height=H;x.save();if(stream&&flip){x.translate(W,0);x.scale(-1,1)}x.drawImage(r.image,0,0,W,H);

  ['Rows aux anneaux 3×8–10'],['Rows aux anneaux, pieds surélevés 4×6–10'],['Rows aux anneaux à une main 3×4–6 par côté']
 ][pullL]:['Rowing sous une table très solide 3×8–10','Superman 3×15 s']).concat(kPull?[kPull]:[]);

const FAM=['planche','fl','sit'],FKEY={planche:'pl',fl:'fl',sit:'ls'};
const LOCKI='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5" fill="currentColor" fill-opacity=".25"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
/* niveau déclaré dans le questionnaire, puis étapes débloquées en analyse */
/* niveau déclaré : la figure la plus dure tenue (0 = aucune). On s'entraîne sur CETTE figure jusqu'à la valider en analyse. */
const declLv=d=>PROF?(PROF[FKEY[d]]??(PROF.level??0)):0;
const baseLv=d=>Math.max(0,declLv(d)-1);
const heldLv=d=>Math.max(declLv(d),lvl(d));
const lvl=d=>Math.min(LAD[d].length,baseLv(d)+(ADV[d]||0));
function effProf(P){const e={...P,held:{}};FAM.forEach(d=>{e[FKEY[d]]=lvl(d);e.held[d]=heldLv(d)});return e}
function shownProf(P){const e={...P};FAM.forEach(d=>{e[FKEY[d]]=heldLv(d)});return e}
function gen(){return PROF?genProgram(effProf(PROF)):null}
function famInfo(id){
 if(!PROF)return null;
 for(const d of FAM){const i=LAD[d].indexOf(id);if(i<0)continue;const L=lvl(d),len=LAD[d].length;
  return i<L?{d,state:'done'}:i===L?{d,state:'cur'}:{d,state:'lock',cur:LAD[d][Math.min(L,len-1)]}}
 return null;
}
/* meilleure moyenne sur une fenêtre d'au moins sec secondes */
function bestWin(S,sec){
 const n=S.length;if(n<2||S[n-1].t-S[0].t<sec)return null;
 const P=[0];S.forEach(q=>P.push(P[P.length-1]+q.s));
 let best=0,j=0;
 for(let i=0;i<n;i++){
  while(j+1<=i&&S[i].t-S[j+1].t>=sec)j++;
  if(S[i].t-S[j].t>=sec)best=Math.max(best,(P[i+1]-P[j])/(i-j+1));
 }
 return best;
}
function progCheck(id,win){

 if(win==null||Math.round(win)<UNL_SCORE)return null;
 const d=f.d;ADV[d]=(ADV[d]||0)+1;LS.set('fd_adv',ADV);
 const L=lvl(d),len=LAD[d].length;
 /* les séances sont régénérées avec la nouvelle figure : on repart d'une coche vierge */
 CHK={};LS.set('fd_chk',CHK);SESS=null;PG=gen();renderNext();
 return{d,id,next:L<len?LAD[d][L]:null,mastered:L>=len,score:Math.round(win)};
}

function rkParts(){
 let fig=0,rep=0,ver=0,qual=0;
 if(PROF){
  FAM.forEach(d=>{const a=RKS[d],k=Math.max(0,Math.min(a.length-1,(+declLv(d)||0)|0));fig+=a[k]});
  const r=PROF.reps||{};RKR.forEach(([k,w,cap])=>{rep+=w*Math.pow(Math.min(1,(+r[k]||0)/cap),.85)});
 }
 FAM.forEach(d=>{ver+=25*Math.min(ADV[d]||0,LAD[d].length)});
 Object.keys(RKW).forEach(id=>{const R=REC[id];if(R&&R.n)qual+=RKW[id]*Math.pow(R.best/100,2)*(.5+.5*Math.min(1,R.hold/UNL_SEC))});
 qual=Math.min(150,qual);
 const days=new Set(HIST.map(h=>new Date(h.d).toDateString())).size,reg=Math.min(20,days*2);
 return{q:Math.round(fig+rep),a:Math.min(400,Math.round(ver+qual+reg)),fig:Math.round(fig),rep:Math.round(rep),ver,qual:Math.round(qual),reg};
}

 return{...p,cur,kept:Math.max(0,pts-cur),pts,i,nx,pct:nx?Math.round(100*(pts-RKT[i])/(nx-RKT[i])):100};
}

["Minotaure",`<path d="M22 114Q20 74 60 68Q100 74 98 114Z" fill="#8a5a3a"/><path d="M38 30Q14 26 12 4Q34 10 46 28ZM82 30Q106 26 108 4Q86 10 74 28Z" fill="#f3ead2"/><path d="M40 40L24 46L32 56ZM80 40L96 46L88 56Z" fill="#a46a44"/><ellipse cx="60" cy="46" rx="22" ry="26" fill="#a46a44"/><ellipse cx="60" cy="62" rx="15" ry="11" fill="#d8a47a"/><circle cx="54" cy="60" r="2.5" fill="#3a1c1c"/><circle cx="66" cy="60" r="2.5" fill="#3a1c1c"/><circle cx="60" cy="72" r="5" stroke="#ffc94d" stroke-width="2.5" fill="none"/><path d="M42 36L56 42M78 36L64 42" stroke="#3a1c1c" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="45" r="3" fill="#ff4d4d"/><circle cx="70" cy="45" r="3" fill="#ff4d4d"/>`],
["Chimère",`<path d="M96 104Q116 92 108 70" stroke="#3f9a3a" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="108" cy="68" r="5" fill="#3f9a3a"/><path d="M60 18L70 28L84 24L88 38L102 44L96 58L102 72L88 78L84 92L70 88L60 98L50 88L36 92L32 78L18 72L24 58L18 44L32 38L36 24L50 28Z" fill="#c26a1a"/><circle cx="60" cy="58" r="24" fill="#f0b25a"/><path d="M42 40Q30 24 40 10Q40 26 50 34ZM78 40Q90 24 80 10Q80 26 70 34Z" fill="#cfd3e6"/><path d="M44 50L56 56M76 50L64 56" stroke="#5a2a0a" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="58" r="3" fill="#1b1f55"/><circle cx="70" cy="58" r="3" fill="#1b1f55"/><path d="M54 66L60 70L66 66" stroke="#5a2a0a" stroke-width="3" fill="none"/><path d="M36 74Q14 68 6 78Q16 82 10 94Q30 92 42 82Z" fill="#ff6a3d"/><path d="M34 78Q20 78 16 84Q24 86 22 90Q32 88 38 84Z" fill="#ffe08a"/>`]];
const MB=[
["Cerbère",`<path d="M20 114Q22 84 60 78Q98 84 100 114Z" fill="#2a2030"/>${dg(26,68,15)}${dg(94,68,15)}${dg(60,52,21)}`],
["Hydre de Lerne",`<ellipse cx="60" cy="104" rx="42" ry="14" fill="#3f8a4a"/><path d="M42 100Q16 72 38 42M60 100Q56 62 62 30M80 100Q106 72 84 46" stroke="#4fae5a" stroke-width="12" fill="none" stroke-linecap="round"/>${hd(38,38)}${hd(62,24)}${hd(84,42)}`],
["Typhon",`<path d="M30 100Q6 108 14 120M90 100Q114 108 106 120" stroke="#3f9a3a" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M26 42Q60 8 94 42L88 98Q60 114 32 98Z" fill="#6a2a6a"/><path d="M30 38L8 6L46 28ZM90 38L112 6L74 28Z" fill="#e8e8f0"/><path d="M36 30L40 10L48 24L56 4L64 24L72 8L80 28" stroke="#ff6a3d" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 56L54 62L34 66ZM86 56L66 62L86 66Z" fill="#ffe34d"/><path d="M38 84L46 94L54 84L62 94L70 84L78 94L84 84" stroke="#fff" stroke-width="3" fill="none" stroke-linejoin="round"/>`]];
const KN='<path d="M50 80L44 106M66 80L74 106" stroke="#3b4a8f" stroke-width="10" stroke-linecap="round"/><rect x="42" y="42" width="30" height="42" rx="11" fill="#e9e3d3"/><circle cx="58" cy="28" r="14" fill="#f2c9a0"/><path d="M43 27Q44 11 60 13Q75 14 73 27Q62 19 43 27Z" fill="#5b3a1e"/><circle cx="66" cy="30" r="2.2" fill="#1b1f55"/><path d="M52 50L64 66L76 58" stroke="#f2c9a0" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="79" cy="57" r="7" fill="#f2c9a0"/><g class="fist"><path d="M66 50L88 50" stroke="#f2c9a0" stroke-width="8" stroke-linecap="round"/><circle cx="92" cy="50" r="8" fill="#f2c9a0"/></g>';
function monIn(i,b){return (b?MB:MR)[i][1]}
const tc=x=>`<circle cx="${x}" cy="72" r="28" fill="#ff9a3d" opacity=".13"/><rect x="${x-2.5}" y="78" width="5" height="22" fill="#5b3a1e"/><path class="fl" d="M${x} 54Q${x+9} 68 ${x} 78Q${x-9} 68 ${x} 54Z" fill="#ff9a3d"/><path class="fl" d="M${x} 63Q${x+5} 71 ${x} 77Q${x-5} 71 ${x} 63Z" fill="#ffe08a"/>`;
const bn=x=>`<path d="M${x} 14H${x+22}V66L${x+11} 56L${x} 66Z" fill="#8f2a3d"/><path d="M${x+11} 24l3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z" fill="#ffc94d"/>`;
const BG='<defs><pattern id="brk" width="40" height="24" patternUnits="userSpaceOnUse"><path d="M0 .75H40M0 12.75H40M20 0V12M0 12V24M40 12V24" stroke="#ffffff1c" stroke-width="1.5" fill="none"/></pattern><pattern id="crn" width="40" height="14" patternUnits="userSpaceOnUse"><rect width="22" height="14" fill="#171a3a"/></pattern></defs><rect width="360" height="168" fill="#2c3160"/><rect width="360" height="168" fill="url(#brk)"/><rect width="360" height="14" fill="url(#crn)"/><path d="M158 128V66Q158 40 180 40Q202 40 202 66V128Z" fill="#0b1030" stroke="#4b5190" stroke-width="5"/><circle cx="186" cy="66" r="8" fill="#e8e8f0"/><circle cx="170" cy="90" r="1.5" fill="#fff"/><circle cx="192" cy="104" r="1.5" fill="#fff"/><path d="M180 40V128M158 84H202" stroke="#4b5190" stroke-width="2"/>'+bn(104)+bn(234)+tc(26)+tc(334)+'<rect y="166" width="360" height="24" fill="#1b1e42"/><path d="M0 166H360M0 178H360M70 166V178M210 166V178M310 166V178M30 178V190M140 178V190M260 178V190" stroke="#ffffff16" stroke-width="1.5"/>';
function arena(){const b=GM.boss,f=GM.fx;return `<svg class="arena" viewBox="0 0 360 190" role="img" aria-label="Combat contre un monstre dans un château">${BG}<ellipse cx="70" cy="166" rx="46" ry="7" fill="#0006"/><ellipse cx="290" cy="166" rx="52" ry="7" fill="#0006"/><g transform="translate(10,52)"><g class="kn ${f==="win"||f==="die"?"punch":f==="lose"?"hurt":""}">${KN}</g></g><g transform="translate(${b?212:230},${b?30:52}) scale(${b?1.2:1})"><g class="mo ${f==="win"?"hit":f==="die"?"die":f==="lose"?"atk":""}">${monIn(GM.mi,b)}</g></g></svg>`}
function spawn(){const b=GM.room%5===0,i=b?(GM.room/5-1)%3:(GM.room-Math.floor(GM.room/5)-1)%5;Object.assign(GM,{boss:b,mi:i,mon:(b?MB:MR)[i][0],atk:3+Math.floor((GM.room-1)/2)+(b?2:0),max:b?3:2,ph:"intro",t:performance.now(),n:0,fx:""});GM.hp=GM.max;dj()}
function phTxt(l){return GM.ph==="intro"?"Prépare-toi… "+Math.ceil(l):GM.ph==="fight"?"Pompes ! "+Math.ceil(l)+" s":GM.ph==="lose"?"Le monstre t'attaque : -"+GM.lastDmg+" PV":GM.fx==="die"?"Coup de poing final ! +"+GM.lastGold+" pièces d'or":"Coup de poing !"}
function gmHit(){if(!GM.on||GM.ph!=="fight")return;GM.n++;GM.reps++;const n=document.getElementById("gn");if(n)n.textContent=GM.n;if(GM.n>GM.atk)gmWin()}
function gmNext(f){const id=GM.id;setTimeout(()=>{if(!GM.on||GM.id!==id)return;f()},1500)}
function gmWin(){GM.ph="win";GM.hp--;GM.fx=GM.hp<=0?"die":"win";if(GM.hp<=0){GM.lastGold=(10+5*GM.room)*(GM.boss?3:1);GM.gold+=GM.lastGold;DJR.gold=(DJR.gold||0)+GM.lastGold;LS.set("astral_dj",DJR)}dj();gmNext(()=>{if(GM.hp<=0){if(GM.boss)GM.life=Math.min(100,GM.life+30);GM.room++;spawn()}else{GM.ph="intro";GM.t=performance.now();GM.fx="";dj()}})}
function gmLose(){GM.ph="lose";GM.lastDmg=Math.max(10,(GM.atk+1-GM.n)*5);GM.life=Math.max(0,GM.life-GM.lastDmg);GM.fx="lose";dj();gmNext(()=>{if(GM.life<=0)gmEnd();else{GM.ph="intro";GM.t=performance.now();GM.fx="";dj()}})}
function gmTick(){if(!GM.on)return;const el=(performance.now()-GM.t)/1000,g=id=>document.getElementById(id);
 if(GM.ph==="intro"){const l=GC.intro-el;if(l<=0){GM.ph="fight";GM.t=performance.now();GM.n=0;if(g("gn"))g("gn").textContent=0}else if(g("gph"))g("gph").textContent=phTxt(l)}
 else if(GM.ph==="fight"){const l=GC.round-el;if(l<=0){gmLose();return}if(g("gch"))g("gch").style.width=l/GC.round*100+"%";if(g("gph"))g("gph").textContent=phTxt(l)}}
function gmStop(){GM.on=0;clearInterval(GM.iv);rp=null;stopAll()}
function gmEnd(){DJR.room=Math.max(DJR.room,GM.room);DJR.reps+=GM.reps;LS.set("astral_dj",DJR);GM.over=1;gmStop();dj()}
async function gmGo(){
 GM.pend=1;stopAll();if(!await init()){GM.pend=0;return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280}}});v.srcObject=stream;await v.play();running=true;loop()}
 catch(e){GM.pend=0;status("Caméra inaccessible : autorise-la dans ton navigateur.");return}
 GM.pend=0;GM.id=(GM.id||0)+1;rp=null;Object.assign(GM,{on:1,room:1,life:100,gold:0,reps:0,over:0});spawn();GM.iv=setInterval(gmTick,100)}
{const i0=init;init=async function(){const ok=await i0();if(ok){const f=!!(GM.on||GM.pend||REPS[$("#sel").value]);if(pose._f!==f){pose._f=f;try{pose.setOptions({modelComplexity:f?0:1,smoothLandmarks:!f})}catch(e){}}}return ok}}
function dj(){
 const d=$("#dj");
 if(!GM.on){d.innerHTML=`<div class="pghead"><h2>Donjon</h2></div><p class="sub">Un donjon infini. Chaque monstre attaque un certain nombre de fois : fais plus de pompes que ce nombre en ${GC.round} s pour lui mettre un coup de poing. Sinon, c'est toi qui perds de la vie (sur 100). Chaque monstre vaincu te rapporte des pièces d'or.</p>${GM.over?`<div class="res"><h2>Défaite !</h2><div class="big">${GM.room}<small> salle atteinte · ${GM.reps} pompes · ${GM.gold} 🪙</small></div></div>`:""}${DJR.room?`<p class="note">Record : salle ${DJR.room} · ${DJR.reps} pompes · ${DJR.gold||0} 🪙 au total</p>`:""}<button class="fin" id="gmgo">Entrer dans le donjon</button><p id="gst" class="note">Pose le téléphone au sol, face à toi : épaules et mains bien visibles.</p>`;return}
 d.innerHTML=`<div class="sc2" style="background:linear-gradient(180deg,#2a2f6b,#05081c)"><div class="rm"><span>Salle ${GM.room}</span><span class="gd">🪙 ${GM.gold}</span></div><div class="lf"><span>Vie</span><div class="pbar"><i style="width:${GM.life}%;background:${GM.life>50?"#4be3a5":GM.life>25?"#ffc94d":"#ff6a7a"}"></i></div><b>${GM.life} / 100</b></div>${arena()}<b class="mn">${GM.boss?"Boss · ":""}${GM.mon}<span class="pips">${"●".repeat(GM.hp)+"○".repeat(GM.max-GM.hp)}</span></b><div class="need"><b id="gn">${GM.n}</b><span> / ${GM.atk+1} pompes</span></div><small>Il attaque ${GM.atk} fois : fais plus de ${GM.atk} pompes en ${GC.round} s pour le frapper.</small><div class="pbar"><i id="gch" style="width:100%;background:#ff6a7a"></i></div><small id="gph">${phTxt(GC.intro)}</small></div><p id="gst" class="note"></p><button class="alt fin" id="gmx">Quitter le donjon</button>`;
}
$("#dj").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="gmgo")gmGo();else if(b.id==="gmx"){GM.over=0;gmStop();dj()}};
{const g0=go;go=function(p){if(p!=="donjon"&&GM.on)gmStop();g0(p);const d=p==="donjon";$("#pgD").hidden=!d;if(d){$("#pgA").hidden=true;dj();try{history.replaceState(null,"","#donjon")}catch(e){}}document.querySelectorAll(".tab").forEach(b=>{const on=b.dataset.p===p;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")})}}
</script>
